name: ${COMPOSE_PROJECT_NAME:-bitrix-lab}

x-php-image: &php-image
  image: bitrix-lab/php:${PHP_VERSION:-8.4.27}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]

# Вебрут — ./www (ядро и upload в .gitignore), собственный код ./local монтируется внутрь.
# Корень репозитория доступен PHP как /app (для composer, тестов, tools), но не nginx.
# .git, git-хуки и настройки Claude — read-only: RCE в PHP не должен дописать хук, исполняемый на хосте.
# Переменные передаются явно (не env_file): в PHP не попадают root-пароль MySQL, мастер-ключи и т.п.
x-php-common: &php-common
  <<: [*php-image, *hardening]
  environment:
    TZ: ${TZ:-Europe/Moscow}
    DOCUMENT_ROOT: /app/www
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    BX_CACHE_SID: ${BX_CACHE_SID:-bitrix-lab}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USER: ${RABBITMQ_USER:-lab}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set in .env}
    MEILI_HOST: http://meilisearch:7700
    MOCK_SERVICES_URL: http://mock-services:8080
  volumes:
    - ./:/app
    - ./local:/app/www/local
    - ./.git:/app/.git:ro
    - ./.githooks:/app/.githooks:ro
    - ./.claude:/app/.claude:ro
  networks: [app, data]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.30.6-alpine
    <<: *hardening
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks: [edge, app]
    volumes:
      - ./www:/app/www:ro
      - ./local:/app/www/local:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/webhooks.conf:/etc/nginx/conf.d/webhooks.conf:ro
      - ./docker/nginx/bitrix-php.inc:/etc/nginx/bitrix-php.inc:ro
    depends_on:
      php: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  php:
    <<: *php-common
    build:
      context: docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.27}
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  worker:
    <<: *php-common
    profiles: [worker]
    pull_policy: never   # тот же образ, что собирает сервис php
    init: true           # SIGTERM доходит до PHP-процесса (graceful shutdown, этап 9)
    stop_grace_period: 30s
    # Консьюмеры RabbitMQ появятся на этапе 9 (local/modules/lab.integration/bin/consume.php)
    command: ["php", "-r", "fwrite(STDERR, \"worker: consumers arrive at stage 9\\n\"); sleep(PHP_INT_MAX);"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bitrix}
      MYSQL_USER: ${MYSQL_USER:-bitrix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/bitrix.cnf:/etc/mysql/conf.d/bitrix.cnf:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    <<: *hardening
    networks: [data]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    <<: *hardening
    networks: [data]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    <<: *hardening
    networks: [data]
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0
    <<: *hardening
    networks: [data]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped

  mock-services:
    image: bitrix-lab/mock-services:${PHP_VERSION:-8.4.27}
    build:
      context: docker/mock-services
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.27}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    <<: *hardening
    environment:
      SITE_URL: http://nginx
    networks: [app]
    ports:
      - "127.0.0.1:${MOCK_PORT:-8090}:8080"
    volumes:
      - ./mock-services:/app:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [sso]
    networks: [app]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    restart: unless-stopped

  # Quick tunnel без аккаунта Cloudflare: публичный https-URL печатается в логах (make tunnel).
  # Смотрит ТОЛЬКО на webhook-сервер nginx (:8081, allowlist путей) — админка и установщик наружу не попадают.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    <<: *hardening
    profiles: [tunnel]
    networks: [edge]
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:8081"]
    depends_on:
      nginx: { condition: service_healthy }

# edge — то, что видит туннель (только nginx); app — веб и моки; data — БД, кеш, очереди.
# Туннель и mock-services не видят MySQL/Redis/RabbitMQ; туннель не видит php-fpm.
networks:
  edge:
  app:
  data:

volumes:
  mysql-data:
  rabbitmq-data:
  meili-data:
