# За туннелем TLS снимает cloudflared: без HTTPS=on Битрикс строит http-ссылки и ломает OAuth Б24.
# Доверяем X-Forwarded-Proto только на этом порту (сюда приходит лишь туннель); на :80 переменная пустая.
map $server_port $lab_fcgi_https {
    8081    $lab_forwarded_https;
    default "";
}
map $http_x_forwarded_proto $lab_forwarded_https {
    https   on;
    default "";
}

# Публичная точка входа для туннеля (make tunnel): только явно перечисленные пути входящих вебхуков.
# Админка, установщик и сайт целиком через туннель НЕ доступны. Новые пути добавляются по этапам (5, 6, 7, 12, 13).
server {
    listen 8081;
    server_name _;
    root /app/www;
    server_tokens off;
    client_max_body_size 8m;

    location ~ ^/local/webhooks/[a-z0-9_-]+\.php$ {
        try_files $uri =404;
        include /etc/nginx/bitrix-php.inc;
    }

    location / {
        return 404;
    }
}
