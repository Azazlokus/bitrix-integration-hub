server {
    listen 80 default_server;
    server_name _;
    root /app/www;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Закрытые пути: исходники модулей, конфиги, логи, зависимости, бэкапы ---
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/(bitrix|local)/(modules|php_interface|vendor|logs|routes|backup|managed_cache|stack_cache|cache|\.settings.*\.php)(/|$) { deny all; }
    location ~* ^/local/(composer\.(json|lock))$ { deny all; }
    location ~* ^/upload/.*\.(php\d*|phtml|phar)$ { deny all; }
    location ~* \.(sql|sql\.gz|tar|tar\.gz|bak|log|env)$ { deny all; }

    # Статика модулей Битрикса публикуется в /bitrix/js, /bitrix/css, /bitrix/images и т.п.
    location ~* \.(js|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /bitrix/urlrewrite.php =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        include fastcgi_params;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
