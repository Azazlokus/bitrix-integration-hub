server {
    listen 80 default_server;
    server_name _;
    root /app/www;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    # Этап 6: для обработчика приложения Б24 (iframe в портале) заменить на CSP frame-ancestors
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Объединённые/минифицированные CSS и JS шаблонов лежат в /bitrix/cache — их отдаём, остальной кеш закрыт
    location ~* ^/bitrix/cache/(css/.+\.css|js/.+\.js)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- Закрытые пути: исходники модулей, конфиги, логи, зависимости, бэкапы ---
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/(bitrix|local)/(modules|php_interface|vendor|logs|routes|backup|managed_cache|stack_cache|cache|tmp|updates|\.settings.*\.php)(/|$) { deny all; }
    location ~* ^/upload/1c_[a-z_]+/ { deny all; }  # файлы обмена CommerceML (заказы, выгрузки)
    location ~* ^/local/(composer\.(json|lock))$ { deny all; }
    location ~* ^/upload/.*\.(php\d*|phtml|phar)$ { deny all; }
    location ~* (\.(sql|sql\.gz|tar|tar\.gz|zip|bak|old|orig|swp|log|env)|~)$ { deny all; }

    # Статика модулей Битрикса публикуется в /bitrix/js, /bitrix/css, /bitrix/images и т.п.
    location ~* \.(js|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /bitrix/urlrewrite.php =404;
        include /etc/nginx/bitrix-php.inc;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
