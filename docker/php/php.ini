; Настройки под требования 1С-Битрикс (проверка: /bitrix/admin/site_checker.php)
date.timezone = ${TZ}
memory_limit = 512M
max_execution_time = 120
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
pcre.recursion_limit = 100000
realpath_cache_size = 4096k
short_open_tag = Off
expose_php = Off

; dev-режим: ошибки видны, но не в браузер (ловим в логе)
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Битрикс требует проверять изменения файлов без задержки
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Почта уходит в Mailpit через msmtp
sendmail_path = "/usr/bin/msmtp -t"

session.cookie_httponly = On
session.use_strict_mode = On
