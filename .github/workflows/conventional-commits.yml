name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Заголовок PR становится сообщением squash-коммита в main
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: tools/check-commit-msg.sh --subject "$PR_TITLE"

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while IFS= read -r subject; do
            tools/check-commit-msg.sh --subject "$subject" || status=1
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$status"
