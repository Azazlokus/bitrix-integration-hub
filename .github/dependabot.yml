version: 2

# Экосистемы добавляются по мере появления манифестов (иначе Dependabot сыпет ошибками):
#   этап 15 — composer + npm (/apps/laravel-hub)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # не брать релиз в первые дни — защита от скомпрометированных версий
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]

  - package-ecosystem: composer
    directory: /local
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    versioning-strategy: increase-if-necessary
    groups:
      dev-tools:
        dependency-type: development
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    commit-message: { prefix: chore, prefix-development: chore, include: scope }
    labels: [dependencies, php]

  - package-ecosystem: docker
    directories: ["/docker/*"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    labels: [dependencies, docker]
